services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////var/lib/telegram-engine/data/telegram_engine.db
      SESSION_STORE_PATH: /var/lib/telegram-engine/sessions
    volumes:
      - appdata:/var/lib/telegram-engine
    ports:
      - "${PORT:-8000}:${PORT:-8000}"

volumes:
  appdata:
